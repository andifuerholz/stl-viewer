<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STL Viewer</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<!-- Füge dies direkt nach dem opening <body>-Tag ein -->
<div style="position: absolute; top: 15px; left: 15px; z-index: 10;">
  <label for="stl-select" style="font-family: sans-serif; font-weight: bold; background: rgba(255,255,255,0.8); padding: 5px; border-radius: 4px;">Modell:</label>
  <select id="stl-select" style="padding: 6px 12px; border-radius: 4px; border: 1px solid #ccc;">
    <option value="">-- Modell wählen --</option>
  </select>
</div>

  <script type="module" src="./viewer.js"></script>
</body>
</html>
